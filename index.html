<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>America Bowl Practice</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  
  <script src="quiz-data.js"></script>
  <script src="script.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="top">
  <div class="wrap header-inner">
    <div>
      <div class="ab-banner">
        <svg class="banner-svg-bg" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/s
          <g class="stars-cluster" fill="currentColor" opacity="0.35">
            <polygon points="30,15 33,23 42,23 35,28 38,36 30,31 22,36 25,28 18,23 27,23"/>
            <polygon points="75,10 78,18 87,18 80,23 83,31 75,26 67,31 70,23 63,18 72,18"/>
            <polygon points="120,20 123,28 132,28 125,33 128,41 120,36 112,41 115,33 108,28 117,28"/>
            <polygon points="50,42 53,50 62,50 55,55 58,63 50,58 42,63 45,55 38,50 47,50"/>
            <polygon points="95,48 98,56 107,56 100,61 103,69 95,64 87,69 90,61 83,56 92,56"/>
          </g>

          <path d="M0,35 Q200,-15 400,25 T800,5" fill="none" stroke="currentColor" stroke-width="3" opacity="0.25"/>
          <path d="M0,20 Q200,-30 400,10 T800,-10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
          
          <path d="M0,195 Q200,235 400,185 T800,205" fill="none" stroke="currentColor" stroke-width="3" opacity="0.25"/>
          <path d="M0,210 Q200,250 400,200 T800,220" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
        </svg>

        <div class="banner-content">
          <div class="banner-divider"><span class="star">★</span></div>
          <h1 id="header-title" class="banner-title">AMERICA BOWL</h1>
          <div class="banner-divider"><span class="star">★</span></div>
        </div>
      </div>

      <p class="sub" id="header-sub">Comprehensive practice that covers vast categories.</p>
    </div>
    
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle Theme">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Dark</span>
    </button>
  </div>

  <div class="wrap">
    <button class="home-link" id="home-link" style="display:none;" type="button">← Back to Categories</button>
  </div>
</header>  

<main class="wrap">
  <section id="screen-home" class="screen active">
    <p class="intro-text">Multiple-choice questions spanning foundational trivia, elections, civil rights, geography, Supreme Court landmark cases, and much more.</p>
    <p class="stats-line" id="stats-line"></p>

    <div class="feature-row">
      <button class="feature-card" id="card-mix" type="button">
        <div class="ttl">Random 30</div>
        <div class="desc">30 random questions picked across all categories.</div>
      </button>
      <button class="feature-card review" id="card-review" type="button" style="display:none;">
        <div class="ttl">Review Missed</div>
        <div class="desc">Re-examine <span id="review-count">0</span> incorrect answers.</div>
      </button>
    </div>

    <h2 class="section-label">Select Category</h2>
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="quiz-meta">
      <span class="cat-chip" id="quiz-cat-chip"></span>
      <span id="quiz-score-label"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="q-card">
      <span class="stamp" id="stamp"></span>
      <p class="qno" id="qno"></p>
      <p class="qtext" id="qtext"></p>
      <div class="options" id="options"></div>
      <div class="q-footer">
        <button class="quit-link" id="quit-link" type="button">Quit Session</button>
        <button class="next-btn" id="next-btn" type="button">Next Question →</button>
      </div>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <div class="result-score">
      <p class="num"><span id="result-correct"></span><small> / <span id="result-total"></span></small></p>
      <p class="pct" id="result-pct"></p>
    </div>
    <p class="result-msg" id="result-msg"></p>
    <div class="breakdown" id="breakdown"></div>
    <div class="result-actions">
      <button class="btn" id="btn-retry" type="button">Repeat the Category</button>
      <button class="btn secondary" id="btn-review-missed" type="button" style="display:none;">Review Missed ones Only</button>
      <button class="btn secondary" id="btn-back" type="button">All Categories</button>
    </div>
  </section>

</main>

<footer class="site-foot">©中本叡 All Rights Reserved.</footer>

</body>
</html>
