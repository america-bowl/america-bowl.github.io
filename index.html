<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アメリカボウル対策ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232017;
  --ink-soft:#5b5643;
  --paper:#f2ecd9;
  --paper-line:#d9cfae;
  --card:#fbf8ee;
  --red:#9c3b34;
  --red-deep:#7a2c27;
  --gold:#b8862f;
  --gold-deep:#8f6521;
  --navy:#1f2b3d;
  --navy-deep:#141b28;
  --navy-text:#eee6cf;
  --focus:#2f6f8f;
  --gold-tint:#ecdfbd;
  --red-tint:#eed3cf;
  --shadow: 0 1px 0 rgba(35,32,23,.06);
  --radius: 10px;
  --font-display:'Zen Old Mincho', serif;
  --font-body:'Zen Kaku Gothic New', sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ece5d2;
    --ink-soft:#b9b092;
    --paper:#171c26;
    --paper-line:#323a4a;
    --card:#1e2531;
    --red:#e07b73;
    --red-deep:#c85a52;
    --gold:#e0b45c;
    --gold-deep:#c99a3e;
    --navy:#0f1420;
    --navy-deep:#0a0d15;
    --navy-text:#efe6cc;
    --gold-tint:#3a3220;
    --red-tint:#3a2521;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ece5d2;
  --ink-soft:#b9b092;
  --paper:#171c26;
  --paper-line:#323a4a;
  --card:#1e2531;
  --red:#e07b73;
  --red-deep:#c85a52;
  --gold:#e0b45c;
  --gold-deep:#c99a3e;
  --navy:#0f1420;
  --navy-deep:#0a0d15;
  --navy-text:#efe6cc;
  --gold-tint:#3a3220;
  --red-tint:#3a2521;
  --shadow: 0 1px 0 rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:inherit}
html,body{height:100%;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.7;
}
img,svg{max-width:100%;display:block}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px;}

.wrap{max-width:760px; margin:0 auto; padding:0 18px;}

/* ---------- header ---------- */
header.top{
  background:var(--navy);
  color:var(--navy-text);
  border-bottom:3px solid var(--gold);
  padding-top: calc(22px + env(safe-area-inset-top, 0px));
  padding-bottom:20px;
}
header.top .kicker{
  font-size:.8rem;
  letter-spacing:.04em;
  color:var(--gold);
  margin:0 0 6px;
  font-weight:500;
}
header.top h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.5rem, 4.4vw, 2.1rem);
  margin:0;
  line-height:1.35;
}
header.top .sub{
  margin:8px 0 0;
  font-size:.9rem;
  color:#cfc6ab;
}
.home-link{
  background:none;border:none;color:var(--gold);
  font-size:.85rem; cursor:pointer; padding:4px 0;
  text-decoration:underline; text-underline-offset:3px;
  font-family:var(--font-body);
}

/* ---------- layout sections ---------- */
main{padding:26px 0 60px;}
.screen{display:none;}
.screen.active{display:block;}

/* ---------- home: intro ---------- */
.intro{
  font-size:.95rem;
  color:var(--ink-soft);
  margin:0 0 22px;
  max-width:56ch;
}
.stats-line{
  font-size:.82rem;
  color:var(--ink-soft);
  margin:-8px 0 22px;
  border-top:1px solid var(--paper-line);
  padding-top:10px;
}

.section-label{
  font-family:var(--font-display);
  font-size:1.05rem;
  font-weight:700;
  margin:0 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--paper-line);
}

/* review / mix cards */
.feature-row{display:grid; gap:12px; grid-template-columns:1fr; margin-bottom:28px;}
@media(min-width:560px){.feature-row{grid-template-columns:1fr 1fr;}}
.feature-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:16px 18px;
  text-align:left;
  cursor:pointer;
  box-shadow:var(--shadow);
  position:relative;
  transition:transform .12s ease, border-color .12s ease;
}
.feature-card:hover{border-color:var(--gold);}
.feature-card:active{transform:translateY(1px);}
.feature-card .ttl{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.05rem;
  margin:0 0 4px;
  color:var(--ink);
}
.feature-card .desc{font-size:.82rem; color:var(--ink-soft); margin:0;}
.feature-card.review{border-color:var(--red); }
.feature-card.review .ttl{color:var(--red-deep);}

/* category grid */
.cat-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:10px;
}
@media(min-width:560px){.cat-grid{grid-template-columns:1fr 1fr;}}
.cat-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:14px 16px;
  cursor:pointer;
  text-align:left;
  box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.cat-card:hover{border-color:var(--gold);}
.cat-card:active{transform:translateY(1px);}
.cat-card .letter{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.5rem;
  color:var(--gold-deep);
  min-width:1.4em;
  text-align:center;
}
.cat-card .info{flex:1; min-width:0;}
.cat-card .name{font-weight:700; font-size:.95rem; margin:0 0 2px;}
.cat-card .meta{font-size:.78rem; color:var(--ink-soft); margin:0;}

/* ---------- quiz screen ---------- */
.quiz-meta{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:.82rem; color:var(--ink-soft); margin-bottom:8px;
}
.quiz-meta .cat-chip{
  background:var(--navy); color:var(--navy-text);
  border-radius:100px; padding:3px 11px; font-size:.74rem;
}
.progress-track{
  height:6px; background:var(--paper-line); border-radius:100px; overflow:hidden; margin-bottom:22px;
}
.progress-fill{
  height:100%; background:var(--gold); width:0%;
  transition:width .3s ease;
}

.q-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:26px 22px 22px;
  position:relative;
  background-image: repeating-linear-gradient(
    var(--card) 0px, var(--card) 37px, var(--paper-line) 38px
  );
  background-position: 0 64px;
}
.q-card .qno{
  font-size:.78rem; color:var(--ink-soft); margin:0 0 10px;
}
.q-card .qtext{
  font-family:var(--font-display);
  font-size:clamp(1.08rem, 3.4vw, 1.32rem);
  font-weight:600;
  line-height:1.6;
  margin:0 0 22px;
}
.stamp{
  position:absolute; top:14px; right:16px;
  font-family:var(--font-display);
  font-weight:900;
  font-size:1rem;
  padding:5px 12px;
  border:3px solid currentColor;
  border-radius:6px;
  transform:rotate(6deg) scale(0);
  opacity:0;
  transition:transform .28s cubic-bezier(.2,1.4,.4,1), opacity .2s ease;
}
.stamp.show{transform:rotate(6deg) scale(1); opacity:1;}
.stamp.correct{color:var(--gold-deep);}
.stamp.incorrect{color:var(--red-deep);}

.options{
  display:grid; grid-template-columns:1fr; gap:10px;
}
@media(min-width:520px){.options{grid-template-columns:1fr 1fr;}}
.opt-btn{
  background:var(--paper);
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  padding:13px 14px;
  font-size:.92rem;
  line-height:1.45;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
  transition:border-color .12s ease, background .12s ease, transform .08s ease;
}
.opt-btn:hover:not(:disabled){border-color:var(--gold); background:var(--card);}
.opt-btn:active:not(:disabled){transform:translateY(1px);}
.opt-btn:disabled{cursor:default;}
.opt-btn .mark{font-weight:700; margin-right:6px;}
.opt-btn.correct{border-color:var(--gold); background:var(--gold-tint);}
.opt-btn.incorrect{border-color:var(--red); background:var(--red-tint);}
.opt-btn.dim{opacity:.55;}

.q-footer{
  margin-top:20px; display:flex; justify-content:space-between; align-items:center;
  min-height:40px;
}
.next-btn{
  background:var(--navy); color:var(--navy-text); border:none;
  border-radius:8px; padding:11px 22px; font-size:.9rem; font-weight:700;
  cursor:pointer; opacity:0; pointer-events:none; transition:opacity .15s ease;
}
.next-btn.show{opacity:1; pointer-events:auto;}
.quit-link{
  background:none;border:none;color:var(--ink-soft); font-size:.8rem;
  text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px 0;
  font-family:var(--font-body);
}

/* ---------- result screen ---------- */
.result-score{
  text-align:center; padding:20px 0 10px;
}
.result-score .num{
  font-family:var(--font-display); font-weight:900;
  font-size:clamp(2.6rem, 12vw, 3.6rem);
  color:var(--navy);
  margin:0;
}
.result-score .num small{font-size:.4em; font-weight:600; color:var(--ink-soft);}
.result-score .pct{color:var(--gold-deep); font-weight:700; margin:4px 0 0; font-size:1rem;}
.result-msg{
  text-align:center; font-size:.9rem; color:var(--ink-soft);
  max-width:44ch; margin:10px auto 26px;
}
.breakdown{margin:0 0 26px;}
.bd-row{
  display:flex; align-items:center; gap:10px; font-size:.82rem;
  padding:6px 0; border-bottom:1px solid var(--paper-line);
}
.bd-row .bd-label{flex:0 0 118px; color:var(--ink-soft);}
.bd-row .bd-bar{flex:1; height:8px; background:var(--paper-line); border-radius:100px; overflow:hidden;}
.bd-row .bd-fill{height:100%; background:var(--gold);}
.bd-row .bd-num{flex:0 0 auto; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

.result-actions{display:flex; flex-direction:column; gap:10px; max-width:340px; margin:0 auto;}
.btn{
  border-radius:8px; padding:12px 18px; font-size:.9rem; font-weight:700;
  cursor:pointer; border:1.5px solid var(--navy); background:var(--navy); color:var(--navy-text);
  text-align:center;
}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--paper-line);}
.btn.secondary:hover{border-color:var(--gold);}
.btn.review{background:var(--red); border-color:var(--red); color:#fff8f2;}

footer.site-foot{
  text-align:center; font-size:.74rem; color:var(--ink-soft);
  padding:20px 0 40px;
}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="kicker">アメリカボウル対策</p>
    <h1 id="header-title">アメリカボウル 対策ドリル</h1>
    <p class="sub" id="header-sub">不定期更新中</p>
    <button class="home-link" id="home-link" style="display:none;" type="button">← 範囲選択に戻る</button>
  </div>
</header>

<main class="wrap">

  <!-- ============ HOME SCREEN ============ -->
  <section id="screen-home" class="screen active">
    <p class="intro">基礎知識・大統領と選挙・日常生活の常識・50州・歴史・文化と習慣・文化遺産と自然遺産・有名人・憲法と最高裁判所・分断する問題、そして最新トピックの付録まで、予想問題を4択形式でノールックで確認できます。</p>
    <p class="stats-line" id="stats-line"></p>

    <div class="feature-row">
      <button class="feature-card mix" id="card-mix" type="button">
        <p class="ttl">ミックス30問</p>
        <p class="desc">全範囲からランダムに30問。腕試しに。</p>
      </button>
      <button class="feature-card review" id="card-review" type="button" style="display:none;">
        <p class="ttl">間違えた問題だけ復習</p>
        <p class="desc"><span id="review-count">0</span>問を再確認</p>
      </button>
    </div>

    <h2 class="section-label">範囲から選ぶ</h2>
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <!-- ============ QUIZ SCREEN ============ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-meta">
      <span class="cat-chip" id="quiz-cat-chip"></span>
      <span id="quiz-score-label"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="q-card">
      <span class="stamp" id="stamp"></span>
      <p class="qno" id="qno"></p>
      <p class="qtext" id="qtext"></p>
      <div class="options" id="options"></div>
      <div class="q-footer">
        <button class="quit-link" id="quit-link" type="button">やめて範囲選択に戻る</button>
        <button class="next-btn" id="next-btn" type="button">次の問題</button>
      </div>
    </div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section id="screen-result" class="screen">
    <div class="result-score">
      <p class="num"><span id="result-correct"></span><small> / <span id="result-total"></span> 正解</small></p>
      <p class="pct" id="result-pct"></p>
    </div>
    <p class="result-msg" id="result-msg"></p>
    <div class="breakdown" id="breakdown"></div>
    <div class="result-actions">
      <button class="btn" id="btn-retry" type="button">同じ範囲をもう一度</button>
      <button class="btn review" id="btn-review-missed" type="button" style="display:none;">間違えた問題だけ復習する</button>
      <button class="btn secondary" id="btn-back" type="button">他の範囲を選ぶ</button>
    </div>
  </section>

</main>

み","ペルグラント廃止運動","職業訓練義務化運動","学生債務帳消し運動（Student Debt Cancellation Movement）"]},{"id":197,"cat":"appendix","catLabel":"付録・最新トピック","q":"忠誠の誓い（Pledge of Allegiance）を作成したのは誰ですか？","a":"フランシス・ベラミー（Francis Bellamy）","options":["フランシス・ベラミー（Francis Bellamy）","トーマス・ジェファソン","ベンジャミン・フランクリン","フランシス・スコット・キー"]},{"id":198,"cat":"appendix","catLabel":"付録・最新トピック","q":"忠誠の誓いは，コロンブスの新大陸到達から何周年を記念して作成されましたか？","a":"400周年","options":["300周年","200周年","400周年","500周年"]},{"id":199,"cat":"appendix","catLabel":"付録・最新トピック","q":"セント・パトリックス・デーはいつですか？","a":"3月17日","options":["3月17日","3月1日","2月14日","4月1日"]},{"id":200,"cat":"appendix","catLabel":"付録・最新トピック","q":"シンコ・デ・マヨ（Cinco de Mayo）は何を記念する日ですか？","a":"1862年のプエブラの戦いでメキシコがフランス軍に勝利したこと","options":["1862年のプエブラの戦いでメキシコがフランス軍に勝利したこと","メキシコの独立記念日","米墨戦争の終結","メキシコ革命の開始"]},{"id":201,"cat":"appendix","catLabel":"付録・最新トピック","q":"ジューンティーンス（Juneteenth）は何月何日ですか？","a":"6月19日","options":["7月4日","5月19日","6月19日","8月1日"]},{"id":202,"cat":"appendix","catLabel":"付録・最新トピック","q":"ジューンティーンスが連邦祝日として制定されたのは何年ですか？","a":"2021年","options":["2016年","2022年","2021年","2015年"]},{"id":203,"cat":"appendix","catLabel":"付録・最新トピック","q":"プライド月間の由来となった1969年の出来事は何ですか？","a":"ストーンウォールの反乱（Stonewall Uprising）","options":["ウッドストック・フェスティバル","ストーンウォールの反乱（Stonewall Uprising）","キング牧師暗殺事件","モンゴメリー・バス・ボイコット"]},{"id":204,"cat":"appendix","catLabel":"付録・最新トピック","q":"サンダンス映画祭を設立したのは誰ですか？","a":"ロバート・レッドフォード（Robert Redford）","options":["ロバート・レッドフォード（Robert Redford）","トム・ハンクス","J.K.ローリング","ビヨンセ"]},{"id":205,"cat":"appendix","catLabel":"付録・最新トピック","q":"ニューイヤーズ・イブにニューヨークのタイムズスクエアで行われる伝統行事は何ですか？","a":"ボールドロップ（Ball Drop）","options":["カウントダウンコンサートのみ","花火大会のみ","ボールドロップ（Ball Drop）","パレード"]},{"id":206,"cat":"appendix","catLabel":"付録・最新トピック","q":"第98回アカデミー賞（2026年3月開催）で作品賞を受賞した作品は何ですか？","a":"『ワン・バトル・アフター・アナザー』（One Battle After Another）","options":["『ハムネット』（Hamnet）","『罪人たち』（Sinners）","『ワン・バトル・アフター・アナザー』（One Battle After Another）","『F1/エフワン』"]},{"id":207,"cat":"appendix","catLabel":"付録・最新トピック","q":"第98回アカデミー賞で監督賞を受賞したのは誰ですか？","a":"ポール・トーマス・アンダーソン（Paul Thomas Anderson）","options":["ポール・トーマス・アンダーソン（Paul Thomas Anderson）","ヨアキム・トリアー","ライアン・クーグラー","クロエ・ジャオ"]},{"id":208,"cat":"appendix","catLabel":"付録・最新トピック","q":"第98回アカデミー賞で主演男優賞を受賞したのは誰ですか？","a":"マイケル・B・ジョーダン（『罪人たち』）","options":["ティモシー・シャラメ","マイケル・B・ジョーダン（『罪人たち』）","イーサン・ホーク","レオナルド・ディカプリオ"]},{"id":209,"cat":"appendix","catLabel":"付録・最新トピック","q":"第98回アカデミー賞で主演女優賞を受賞したのは誰ですか？","a":"ジェシー・バックリー（『ハムネット』）","options":["ジェシー・バックリー（『ハムネット』）","ローズ・バーン","ケイト・ハドソン","エマ・ストーン"]},{"id":210,"cat":"appendix","catLabel":"付録・最新トピック","q":"2026年版フォーブス世界長者番付で世界一の富豪は誰ですか？","a":"イーロン・マスク（Elon Musk，資産約8,390億ドル）","options":["イーロン・マスク（Elon Musk，資産約8,390億ドル）","マーク・ザッカーバーグ","ジェフ・ベゾス","ラリー・ペイジ"]},{"id":211,"cat":"appendix","catLabel":"付録・最新トピック","q":"プレジデンツ・デーは，もともとどの2人の大統領の誕生日を記念する祝日でしたか？","a":"ジョージ・ワシントンとエイブラハム・リンカーン","options":["フランクリン・ルーズベルトとハリー・トルーマン","ジョン・F・ケネディとリンドン・ジョンソン","トーマス・ジェファソンとジョン・アダムズ","ジョージ・ワシントンとエイブラハム・リンカーン"]}]</script>
<script>
(function(){
  "use strict";

  var ALL_Q = JSON.parse(document.getElementById('quiz-data').textContent);

  var CAT_ORDER = ["prereq","A","B","C","D","E","F","G","H","I","appendix"];
  var CAT_META = {};
  ALL_Q.forEach(function(q){
    if(!CAT_META[q.cat]) CAT_META[q.cat] = {label:q.catLabel, count:0, letter:catLetter(q.cat)};
    CAT_META[q.cat].count++;
  });

  function catLetter(cat){
    var map = {prereq:"前提", A:"A", B:"B", C:"C", D:"D", E:"E", F:"F", G:"G", H:"H", I:"I", appendix:"付録"};
    return map[cat] || "?";
  }

  // ---------- storage helpers ----------
  function loadJSON(key, fallback){
    try{
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  var missed = loadJSON('ab_missed_v1', []); // array of question ids
  var bestScores = loadJSON('ab_best_v1', {}); // {catKey: {correct,total}}
  var totals = loadJSON('ab_totals_v1', {answered:0, correct:0});

  // ---------- DOM refs ----------
  var screens = {
    home: document.getElementById('screen-home'),
    quiz: document.getElementById('screen-quiz'),
    result: document.getElementById('screen-result')
  };
  var homeLink = document.getElementById('home-link');
  var headerTitle = document.getElementById('header-title');
  var headerSub = document.getElementById('header-sub');

  function showScreen(name){
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle('active', k === name);
    });
    homeLink.style.display = (name === 'home') ? 'none' : 'inline-block';
    window.scrollTo({top:0, behavior:'auto'});
  }

  // ---------- home screen render ----------
  function renderHome(){
    headerTitle.textContent = "アメリカボウル 対策ドリル";
    headerSub.textContent = "前提知識から分断問題まで、出題範囲を全問カバー。";

    var statsLine = document.getElementById('stats-line');
    if(totals.answered > 0){
      statsLine.textContent = 'これまでの累計成績：' + totals.answered + '問中 ' + totals.correct + '問正解（正答率' + Math.round(totals.correct/totals.answered*100) + '%）';
    } else {
      statsLine.textContent = '';
    }

    var reviewCard = document.getElementById('card-review');
    var reviewCount = document.getElementById('review-count');
    if(missed.length > 0){
      reviewCard.style.display = '';
      reviewCount.textContent = missed.length;
    } else {
      reviewCard.style.display = 'none';
    }

    var grid = document.getElementById('cat-grid');
    grid.innerHTML = '';
    CAT_ORDER.forEach(function(cat){
      var meta = CAT_META[cat];
      if(!meta) return;
      var best = bestScores[cat];
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'cat-card';
      var bestText = best ? ('前回 ' + best.correct + '/' + best.total) : (meta.count + '問');
      card.innerHTML =
        '<span class="letter">' + meta.letter + '</span>' +
        '<span class="info"><p class="name">' + escapeHTML(meta.label) + '</p>' +
        '<p class="meta">' + escapeHTML(bestText) + '</p></span>';
      card.addEventListener('click', function(){ startQuiz(cat); });
      grid.appendChild(card);
    });
  }

  document.getElementById('card-mix').addEventListener('click', function(){
    startQuiz('__mix__');
  });
  document.getElementById('card-review').addEventListener('click', function(){
    startQuiz('__review__');
  });
  document.getElementById('home-link').addEventListener('click', function(){
    renderHome();
    showScreen('home');
  });
  document.getElementById('quit-link').addEventListener('click', function(){
    renderHome();
    showScreen('home');
  });
  document.getElementById('btn-back').addEventListener('click', function(){
    renderHome();
    showScreen('home');
  });

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------- quiz session state ----------
  var session = null;

  function startQuiz(catKey){
    var pool, label;
    if(catKey === '__mix__'){
      pool = shuffle(ALL_Q).slice(0, 30);
      label = 'ミックス30問';
    } else if(catKey === '__review__'){
      pool = ALL_Q.filter(function(q){ return missed.indexOf(q.id) !== -1; });
      pool = shuffle(pool);
      label = '復習（前回間違えた問題）';
    } else {
      pool = shuffle(ALL_Q.filter(function(q){ return q.cat === catKey; }));
      label = CAT_META[catKey].label;
    }
    if(pool.length === 0){ return; }
    session = {
      catKey: catKey,
      label: label,
      questions: pool,
      index: 0,
      score: 0,
      answered: false,
      wrongIds: [],
      perCatStats: {} // for mix mode breakdown
    };
    headerTitle.textContent = label;
    headerSub.textContent = pool.length + '問';
    showScreen('quiz');
    renderQuestion();
  }

  function renderQuestion(){
    var q = session.questions[session.index];
    session.answered = false;

    document.getElementById('quiz-cat-chip').textContent = q.catLabel;
    document.getElementById('quiz-score-label').textContent = '正解 ' + session.score;
    document.getElementById('qno').textContent = '問 ' + (session.index + 1) + ' / ' + session.questions.length;
    document.getElementById('qtext').textContent = q.q;

    var pct = Math.round((session.index) / session.questions.length * 100);
    document.getElementById('progress-fill').style.width = pct + '%';

    var stamp = document.getElementById('stamp');
    stamp.className = 'stamp';
    stamp.textContent = '';

    var optsWrap = document.getElementById('options');
    optsWrap.innerHTML = '';
    var letters = ['A','B','C','D'];
    q.options.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-btn';
      btn.innerHTML = '<span class="mark">' + letters[i] + '</span>' + escapeHTML(opt);
      btn.addEventListener('click', function(){ selectAnswer(btn, opt, q); });
      optsWrap.appendChild(btn);
    });

    document.getElementById('next-btn').classList.remove('show');
  }

  function selectAnswer(btn, chosen, q){
    if(session.answered) return;
    session.answered = true;

    var correct = (chosen === q.a);
    var stamp = document.getElementById('stamp');

    totals.answered++;
    if(correct){
      totals.correct++;
      session.score++;
      stamp.textContent = '正解';
      stamp.className = 'stamp correct show';
      // remove from missed list if present
      var mi = missed.indexOf(q.id);
      if(mi !== -1){ missed.splice(mi, 1); }
    } else {
      stamp.textContent = '不正解';
      stamp.className = 'stamp incorrect show';
      session.wrongIds.push(q.id);
      if(missed.indexOf(q.id) === -1){ missed.push(q.id); }
    }
    saveJSON('ab_missed_v1', missed);
    saveJSON('ab_totals_v1', totals);

    // per-category tally (for mix-mode breakdown)
    var cs = session.perCatStats[q.cat] || (session.perCatStats[q.cat] = {label:q.catLabel, correct:0, total:0});
    cs.total++;
    if(correct) cs.correct++;

    var allBtns = document.querySelectorAll('#options .opt-btn');
    allBtns.forEach(function(b){
      b.disabled = true;
      var isThisCorrectText = (b.textContent.replace(/^[A-D]/, '') === q.a);
      if(b === btn && correct){ b.classList.add('correct'); }
      else if(b === btn && !correct){ b.classList.add('incorrect'); }
      else if(isThisCorrectText){ b.classList.add('correct'); }
      else { b.classList.add('dim'); }
    });

    document.getElementById('quiz-score-label').textContent = '正解 ' + session.score;
    document.getElementById('next-btn').classList.add('show');
  }

  document.getElementById('next-btn').addEventListener('click', function(){
    session.index++;
    if(session.index >= session.questions.length){
      finishQuiz();
    } else {
      renderQuestion();
    }
  });

  function finishQuiz(){
    document.getElementById('progress-fill').style.width = '100%';

    // save best score per single category (not for mix/review sessions)
    if(session.catKey !== '__mix__' && session.catKey !== '__review__'){
      bestScores[session.catKey] = {correct: session.score, total: session.questions.length};
      saveJSON('ab_best_v1', bestScores);
    }

    var total = session.questions.length;
    var correct = session.score;
    var pct = Math.round(correct / total * 100);

    document.getElementById('result-correct').textContent = correct;
    document.getElementById('result-total').textContent = total;
    document.getElementById('result-pct').textContent = '正答率 ' + pct + '%';

    var msg;
    if(pct >= 90) msg = '安定して正解できています。この調子で本番の早押しにも備えましょう。';
    else if(pct >= 70) msg = 'かなり定着してきています。間違えた問題を中心に復習すると効果的です。';
    else if(pct >= 40) msg = '土台はできています。苦手な範囲を選んで繰り返し確認しましょう。';
    else msg = 'まずは範囲ごとに繰り返し解いて、用語に慣れていきましょう。';
    document.getElementById('result-msg').textContent = msg;

    var bd = document.getElementById('breakdown');
    bd.innerHTML = '';
    var catKeys = Object.keys(session.perCatStats);
    if(catKeys.length > 1){
      catKeys.forEach(function(ck){
        var s = session.perCatStats[ck];
        var row = document.createElement('div');
        row.className = 'bd-row';
        var p = Math.round(s.correct / s.total * 100);
        row.innerHTML =
          '<span class="bd-label">' + escapeHTML(s.label) + '</span>' +
          '<span class="bd-bar"><span class="bd-fill" style="width:' + p + '%"></span></span>' +
          '<span class="bd-num">' + s.correct + '/' + s.total + '</span>';
        bd.appendChild(row);
      });
    }

    var reviewBtn = document.getElementById('btn-review-missed');
    if(session.wrongIds.length > 0){
      reviewBtn.style.display = '';
      reviewBtn.onclick = function(){
        var pool = shuffle(ALL_Q.filter(function(q){ return session.wrongIds.indexOf(q.id) !== -1; }));
        session = {
          catKey: '__review__', label: 'この回で間違えた問題', questions: pool,
          index: 0, score: 0, answered:false, wrongIds: [], perCatStats: {}
        };
        headerTitle.textContent = session.label;
        headerSub.textContent = pool.length + '問';
        showScreen('quiz');
        renderQuestion();
      };
    } else {
      reviewBtn.style.display = 'none';
    }

    document.getElementById('btn-retry').onclick = function(){
      startQuiz(session.catKey === '__review__' ? '__review__' : session.catKey);
    };

    showScreen('result');
  }

  // ---------- init ----------
  renderHome();
})();
</script>
</body>
</html>
